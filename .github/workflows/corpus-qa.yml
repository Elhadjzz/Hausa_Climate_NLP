name: HESTC corpus QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Reconstruct master corpus
        run: python src/merge_corpus_parts.py

      - name: Run independent corpus QA
        run: python src/qa_corpus.py data/HESTC10K_master.csv --json-out build/qa.json

      - name: Build deterministic 500-term ClimateNLP silver benchmark
        run: |
          python src/build_climate_benchmark.py \
            --corpus data/HESTC10K_master.csv \
            --out build/hestc_climate_silver_terms.csv

      - name: Verify silver benchmark size
        run: |
          python - <<'PY'
          import csv
          with open('build/hestc_climate_silver_terms.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 500, len(rows)
          assert len({r['domain'] for r in rows}) == 10
          print('Verified', len(rows), 'rows across 10 HESTC domains')
          PY

      - name: Run regression tests
        run: pytest -q

      - name: Upload QA and silver benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hestc-corpus-qa-and-silver-benchmark
          path: |
            build/qa.json
            build/hestc_climate_silver_terms.csv
