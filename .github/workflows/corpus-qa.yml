name: HESTC corpus QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Reconstruct master corpus
        run: python src/merge_corpus_parts.py

      - name: Run independent corpus QA
        run: python src/qa_corpus.py data/HESTC10K_master.csv --json-out build/qa.json

      - name: Run regression tests
        run: pytest -q
