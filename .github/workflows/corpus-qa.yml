name: HESTC corpus QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Reconstruct master corpus
        run: python src/merge_corpus_parts.py

      - name: Run independent corpus QA
        run: python src/qa_corpus.py data/HESTC10K_master.csv --json-out build/qa.json

      - name: Build deterministic 500-term ClimateNLP silver benchmark
        run: |
          python src/build_climate_benchmark.py \
            --corpus data/HESTC10K_master.csv \
            --out build/hestc_climate_silver_terms.csv

      - name: Verify silver benchmark size
        run: |
          python - <<'PY'
          import csv
          with open('build/hestc_climate_silver_terms.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 500, len(rows)
          assert len({r['domain'] for r in rows}) == 10
          print('Verified', len(rows), 'rows across 10 HESTC domains')
          PY

      - name: Build 200-term human validation pilot
        run: |
          python src/build_validation_pilot.py \
            --corpus data/HESTC10K_master.csv \
            --out build/hestc_validation_pilot_200.csv

      - name: Verify validation pilot
        run: |
          python - <<'PY'
          import csv
          with open('build/hestc_validation_pilot_200.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 200, len(rows)
          assert len({r['domain'] for r in rows}) == 10
          print('Verified', len(rows), 'validation rows across 10 HESTC domains')
          PY

      - name: Build 800-sentence human-reference benchmark package
        run: |
          python src/build_human_sentence_benchmark.py \
            --corpus data/HESTC10K_master.csv \
            --out-dir build/human_benchmark_800

      - name: Verify 800-sentence benchmark design
        run: |
          python - <<'PY'
          import csv, collections
          p='build/human_benchmark_800/HESTC_ClimateNLP_Human_Benchmark_800_Blind.csv'
          with open(p, encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==800, len(rows)
          domains=collections.Counter(r['domain'] for r in rows)
          splits=collections.Counter(r['split'] for r in rows)
          assert set(domains.values())=={80}, domains
          assert splits=={'train':480,'dev':120,'test':200}, splits
          assert len({r['sentence_id'] for r in rows})==800
          assert len({r['english_sentence'] for r in rows})==800
          print('Verified 800 sentences, 80/domain, 480/120/200 split')
          PY

      - name: Run regression tests
        run: pytest -q

      - name: Upload QA and silver benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hestc-corpus-qa-and-silver-benchmark
          path: |
            build/qa.json
            build/hestc_climate_silver_terms.csv
            build/hestc_validation_pilot_200.csv
            build/human_benchmark_800/
